site_name: dqntrain
site_description: Simple, resumable Unsloth + TRL training pipelines with Hugging Face-backed state
repo_url: https://github.com/DQN-Labs/dqntrain
repo_name: DQN-Labs/dqntrain
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Stages: stages.md
  - Configuration: config.md
  - Data pipeline: data.md
  - Resume and state: resume.md
  - Rewards: rewards.md
  - Custom stages: custom-stages.md
  - Stores and testing: stores.md
  - Environment: environment.md
  - API reference: api.md
